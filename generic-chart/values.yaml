persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

ingress:
  enabled: false
  # ingressClassName: nginx
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  # hosts:
  #   - host: somenewapp.simplify.network
  #     pathType: ImplementationSpecific
