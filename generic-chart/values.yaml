# Auto-Scaling
vpa:
  enabled: false

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Cron Job
# The image, ENVs, annotations, nodeSelector and affinity are all the same as Deployment settings
# But you can run a different command or setup the cron scheduler
cronjob:
  enabled: false
  # Run every minute
  schedule: "* * * * *"
  command: ["sh", "-c", "echo CronJob Running..."]
  restartPolicy: Never
  resources: {}

  # Optional settings
  # suspend: false
  # concurrencyPolicy: Allow
  # successfulJobsHistoryLimit: 3
  # failedJobsHistoryLimit: 3
  # restartPolicy: Never
  # terminationGracePeriodSeconds: 30
